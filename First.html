<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="Home.png">
     
    <title>WebTech Webpage</title>
</head>
<body>
    <h1 style="color: rgb(178, 56, 195);">Student Registration Form</h1>


    <form action="#" method="post">
        <!-- <fieldset style="margin">Student Registration Form</fieldset> -->
        <label for="name">Full Name:</label>
        <input type="text"name="name"id="name" placeholder="Name" required><br><br>
         <label for="email">Email:</label>
        <input type="email"name="email"id="email" placeholder="Email" required><br><br>
         <label for="pass">Password:</label>
        <input type="password"name="password"id="pass" placeholder="Password"><br><br>
        <label for="age">Age:</label>
        <!-- <label for="age">Age:</label> -->
        <input type="number"name="age"id="number" placeholder="age" required><br><br>
        <label for="Date of Birth">Date of Birth:</label>
        <input type="date" placeholder="Date" required><br><br>
        <!-- <input type="age"name="email"id="age" placeholder="Age" ><br><br>
        <input type="date" name="date" id="date"><br><br> -->
        
        
        
         Gender:
         <input type="radio" name="Gender" id="Male">Male
         <input type="radio" name="Gender" id="Female">Female
         <br>
         <br>
         
         Hobbies:

         <input type="checkbox" name="Gender" id="reading">Reading
         <input type="checkbox" name="Gender" id="cricket">Cricket
         <input type="checkbox" name="Gender" id="music">Music
         <br><br>




         <label for="text">About Yourself:</label><br>
        <textarea name="about yourself" id="about yourself" rows="5" cols="30" placeholder="About yourself"></textarea><br><br>



        <input type="button" value="Submit" onclick="alert('Form Submitted Successfully')" style="background-color: rgb(211, 167, 204); color: white;box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.3); padding: 10px 20px 7px; border: none; border-radius: 5px; cursor: pointer;height: 40px; width: 100px;" >
        <input type="reset" value="Reset" onclick="alert('Form Reset Successfully')" style="background-color: rgb(211, 167, 204); color: white;box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.3); padding: 10px 20px 7px; border: none; border-radius: 5px; cursor: pointer;height: 40px; width: 100px;" >

  
         
</fieldset>

    </form>
    
</body>
</html>
